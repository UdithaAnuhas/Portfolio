<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Uditha Anuhas (Aries) — Student Developer & Gamer. Find all my social links.">
    <meta name="theme-color" content="#0a0015">
    <meta property="og:title" content="Aries — Links">
    <meta property="og:description" content="All my social links in one place.">
    <meta property="og:type" content="website">
    <title>Aries — Links ✦</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Page Styles -->
    <link rel="stylesheet" href="links.css">
</head>

<body class="links-page" style="background-color: #0a0015; color: #ffffff;">

    <!-- ===== Preloader Screen (Instant Dark & Spinner for Slow Connections) ===== -->
    <div id="page-preloader" style="position: fixed; inset: 0; z-index: 999999; background: #0a0015; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity 0.4s ease, visibility 0.4s ease;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(168, 85, 247, 0.2); border-top-color: #a855f7; border-radius: 50%; animation: preloaderSpin 0.75s linear infinite;"></div>
        <span style="font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; color: #c084fc; letter-spacing: 2px; text-transform: uppercase;">Aries ✦</span>
    </div>
    <style>
        @keyframes preloaderSpin { to { transform: rotate(360deg); } }
    </style>
    <script>
        window.addEventListener('load', function() {
            var p = document.getElementById('page-preloader');
            if (p) {
                p.style.opacity = '0';
                p.style.visibility = 'hidden';
                setTimeout(function() { p.remove(); }, 450);
            }
        });
        // Fallback safety timeout if video takes long
        setTimeout(function() {
            var p = document.getElementById('page-preloader');
            if (p) {
                p.style.opacity = '0';
                p.style.visibility = 'hidden';
                setTimeout(function() { p.remove(); }, 450);
            }
        }, 2000);
    </script>

    <!-- ===== Fullscreen Video Background ===== -->
    <div class="bg-fullscreen">
        <video autoplay muted loop playsinline id="bg-video">
            <source src="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Anime.Nature.mp4" type="video/mp4">
        </video>
    </div>
    <div class="bg-overlay"></div>

    <!-- ===== Particles ===== -->
    <canvas id="particle-canvas"></canvas>

    <!-- ===== Click to Enter Overlay (Guns.lol Style) ===== -->
    <div class="enter-overlay" id="enter-overlay">
        <div class="enter-content">
            <span class="enter-text">✦ click anywhere to enter ✦</span>
        </div>
    </div>

    <!-- ===== Audio Toggle (Top Left) ===== -->
    <button class="audio-toggle" id="audio-toggle" aria-label="Toggle music" title="Toggle Music">
        <i class="fa-solid fa-volume-xmark" id="audio-icon"></i>
    </button>

    <!-- ===== Admin Controls (Top Right) ===== -->
    <button class="admin-btn" id="admin-btn" aria-label="Admin settings" title="Admin Background Settings">
        <i class="fa-solid fa-sliders" id="admin-icon"></i>
    </button>

    <!-- ===== Admin Background Modal ===== -->
    <div class="admin-modal" id="admin-modal">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h3><i class="fa-solid fa-wand-magic-sparkles"></i> Admin Background Controls</h3>
                <button class="admin-modal-close" id="admin-modal-close">&times;</button>
            </div>
            <div class="admin-modal-body">
                <!-- Login View -->
                <div id="admin-login-view">
                    <p class="admin-modal-desc">Enter admin password to customize the background:</p>
                    <input type="password" id="admin-pass-input" placeholder="Enter Admin Password..." class="admin-input">
                    <button id="admin-login-btn" class="admin-action-btn">Unlock Controls</button>
                    <p id="admin-login-err" class="admin-err-msg"></p>
                </div>
                <!-- Controls View -->
                <div id="admin-controls-view" style="display: none;">
                    <label class="admin-label">Preset Videos:</label>
                    <select id="bg-preset-select" class="admin-select">
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Anime.Nature.mp4">Anime Nature</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Anime.gurl.mp4">Anime Girl</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/anime.2.mp4">Anime 2</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Jujustu.Kaisen.mp4">Jujutsu Kaisen</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Naruto.mp4">Naruto</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Spider.Man.mp4">Spider Man 01</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/Spider-Man02.mp4">Spider Man 02</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/4K.Universe01_90.mp4">Universe 4K (01)</option>
                        <option value="https://github.com/UdithaAnuhas/Portfolio/releases/download/v1.0/4K.Universe02_90.mp4">Universe 4K (02)</option>
                        <option value="custom">-- Custom Video URL --</option>
                    </select>

                    <div id="custom-url-wrapper" style="display: none; margin-top: 10px;">
                        <label class="admin-label">Custom Video URL (GitHub / CDN):</label>
                        <input type="url" id="custom-video-url" placeholder="https://..." class="admin-input">
                    </div>

                    <label class="admin-label" style="margin-top: 14px;">Rotation Orientation:</label>
                    <select id="bg-rotation-select" class="admin-select">
                        <option value="270deg">270° (Flipped Landscape)</option>
                        <option value="90deg">90° (Clockwise Landscape)</option>
                        <option value="0deg">0° (Original Portrait)</option>
                    </select>

                    <button id="admin-save-bg-btn" class="admin-action-btn" style="margin-top: 18px;">
                        <i class="fa-solid fa-floppy-disk"></i> Apply & Save Background
                    </button>
                    <p id="admin-save-msg" class="admin-success-msg"></p>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== Main Content ===== -->
    <main class="links-container">

        <!-- Avatar -->
        <div class="avatar-wrapper fade-in delay-1">
            <div class="avatar-ring">
                <img src="assets/avatar.jpg" alt="Aries">
            </div>
        </div>

        <!-- Username -->
        <h1 class="profile-username fade-in delay-2">Uditha Anuhas</h1>

        <!-- Bio / Typewriter -->
        <div class="profile-bio fade-in delay-3">
            <span id="bio-text"></span><span class="cursor-blink"></span>
        </div>

        <!-- Location -->
        <div class="profile-location fade-in delay-3">
            <span class="location-dot"></span>
            Sri Lanka
        </div>

        <!-- Discord Status Widget (High Visibility Glass Card) -->
        <a href="https://discord.com/users/1445792800699584677" target="_blank" rel="noopener noreferrer" class="discord-widget-link fade-in delay-4" title="Open Discord Profile">
            <div class="discord-widget">
                <div class="discord-avatar-container">
                    <img src="assets/avatar.jpg" alt="Discord Avatar" class="discord-avatar" id="discord-avatar-img">
                    <span class="discord-status-dot" id="discord-dot"></span>
                </div>
                <div class="discord-info">
                    <div class="discord-name-row">
                        <span class="discord-name" id="discord-username">Aries</span>
                        <span class="discord-status-badge" id="discord-status-badge">Online</span>
                    </div>
                    <span class="discord-activity-text" id="discord-activity">
                        <i class="fa-solid fa-gamepad"></i> Playing Valorant
                    </span>
                </div>
            </div>
        </a>

        <!-- Social Icons -->
        <div class="social-icons fade-in delay-5">
            <a href="https://discord.com/users/1445792800699584677" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--discord" title="Discord Profile">
                <i class="fa-brands fa-discord"></i>
            </a>
            <a href="https://github.com/UdithaAnuhas" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--github" title="GitHub">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="https://steamcommunity.com/id/uditha_anuhas/" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--steam" title="Steam">
                <i class="fa-brands fa-steam"></i>
            </a>
            <a href="https://instagram.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--instagram" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://facebook.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--facebook" title="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>
            <a href="https://reddit.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--reddit" title="Reddit">
                <i class="fa-brands fa-reddit-alien"></i>
            </a>
            <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--linkedin" title="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://spotify.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--spotify" title="Spotify">
                <i class="fa-brands fa-spotify"></i>
            </a>
            <a href="https://youtube.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--youtube" title="YouTube">
                <i class="fa-brands fa-youtube"></i>
            </a>
            <a href="https://mail.google.com/mail/?view=cm&fs=1&to=anuhas.ekanayaka320@gmail.com" target="_blank" rel="noopener noreferrer"
                class="social-icon social-icon--email" title="Compose Gmail">
                <i class="fa-solid fa-envelope"></i>
            </a>
        </div>

        <!-- Long Separate Portfolio Button -->
        <a href="index.html" target="aries_portfolio_tab" rel="noopener" class="portfolio-action-btn fade-in delay-6" title="Explore My World">
            <div class="portfolio-btn-content">
                <i class="fa-solid fa-rocket portfolio-btn-icon"></i>
                <div class="portfolio-btn-text">
                    <span class="portfolio-btn-title">Explore My World</span>
                    <span class="portfolio-btn-subtitle">Games I play, Coding projects & Memory vault</span>
                </div>
                <i class="fa-solid fa-chevron-right portfolio-btn-arrow"></i>
            </div>
        </a>

        <!-- Visitor Counter -->
        <div class="visitor-counter fade-in delay-6">
            <i class="fa-solid fa-eye"></i>
            <span id="visitor-count">0</span>
        </div>

    </main>

    <!-- ===== Scripts ===== -->
    <script src="links.js"></script>

</body>

</html>
